<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Teacher Control Panel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#eef2ff;
color:#111827;
}

.header{
background:linear-gradient(135deg,#1e3a8a,#2563eb);
color:white;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:10px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}

.header-left h1{
font-size:28px;
}

.header-left p{
font-size:14px;
opacity:.9;
margin-top:4px;
}

.header-right{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.header-btn{
background:white;
color:#1e3a8a;
border:none;
padding:10px 16px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.container{
max-width:1400px;
margin:auto;
padding:20px;
}

.top-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.card-title{
font-size:14px;
color:#6b7280;
margin-bottom:10px;
}

.big-text{
font-size:28px;
font-weight:bold;
color:#1e3a8a;
}

.middle-grid{
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
margin-bottom:20px;
}

.word-box{
background:white;
border-radius:18px;
padding:30px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
min-height:250px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.word-label{
font-size:18px;
color:#6b7280;
margin-bottom:20px;
}

.word{
font-size:54px;
font-weight:bold;
color:#1e40af;
margin-bottom:20px;
word-break:break-word;
}

.timer{
font-size:72px;
font-weight:bold;
color:#dc2626;
}

.status-box{
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.status-title{
font-size:20px;
font-weight:bold;
margin-bottom:15px;
color:#1e3a8a;
}

.status{
font-size:18px;
font-weight:bold;
padding:14px;
border-radius:10px;
background:#dbeafe;
color:#1d4ed8;
margin-bottom:20px;
text-align:center;
}

.vote-grid{
display:grid;
grid-template-columns:1fr;
gap:12px;
}

.vote-btn{
padding:16px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
color:white;
transition:.2s;
}

.vote-btn:disabled{
opacity:.5;
cursor:not-allowed;
}

.correct{
background:#16a34a;
}

.wrong{
background:#dc2626;
}

.notspelt{
background:#f59e0b;
}

.controls{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.control-btn{
padding:16px;
border:none;
border-radius:14px;
font-size:16px;
font-weight:bold;
cursor:pointer;
color:white;
transition:.2s;
}

.control-btn:hover{
transform:translateY(-2px);
}

.start{
background:#16a34a;
}

.stop{
background:#dc2626;
}

.finalize{
background:#2563eb;
}

.next{
background:#7c3aed;
}

.reset{
background:#ef4444;
}

.music{
background:#db2777;
}

.secondary{
background:#475569;
}

.music-panel{
margin-top:20px;
background:white;
padding:20px;
border-radius:18px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
display:none;
}

.music-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:12px;
margin-top:15px;
}

.music-btn{
padding:14px;
border:none;
border-radius:10px;
background:#f3f4f6;
cursor:pointer;
font-weight:bold;
}

.footer-note{
margin-top:25px;
text-align:center;
color:#6b7280;
font-size:14px;
}

@media(max-width:900px){

.middle-grid{
grid-template-columns:1fr;
}

.word{
font-size:38px;
}

.timer{
font-size:56px;
}

}

</style>

</head>

<body>

<div class="header">

<div class="header-left">
<h1 id="stageTitle">
Loading Stage...
</h1>

<p id="competitionTitle">
Competition Loading...
</p>
</div>

<div class="header-right">

<button class="header-btn"
onclick="goLeaderboard()">
Leaderboard
</button>

<button class="header-btn"
onclick="goHome()">
Home
</button>

</div>

</div>

<div class="container">

<!-- TOP INFO -->
<div class="top-grid">

<div class="card">
<div class="card-title">
Participant
</div>

<div class="big-text"
id="studentName">
Loading...
</div>
</div>

<div class="card">
<div class="card-title">
Round
</div>

<div class="big-text"
id="roundInfo">
1/3
</div>
</div>

<div class="card">
<div class="card-title">
Round Score
</div>

<div class="big-text"
id="roundScore">
0
</div>
</div>

<div class="card">
<div class="card-title">
Total Score
</div>

<div class="big-text"
id="totalScore">
0
</div>
</div>

</div>

<!-- MIDDLE -->
<div class="middle-grid">

<div class="word-box">

<div class="word-label">
Word To Spell
</div>

<div class="word"
id="word">
READY
</div>

<div class="timer"
id="timer">
0
</div>

</div>

<div class="status-box">

<div class="status-title">
Competition Status
</div>

<div class="status"
id="status">
Waiting To Start
</div>

<div class="vote-grid">

<button class="vote-btn correct"
id="correctBtn"
disabled
onclick="submitVote('correct')">

✔ Correct
</button>

<button class="vote-btn wrong"
id="wrongBtn"
disabled
onclick="submitVote('wrong')">

✖ Wrong
</button>

<button class="vote-btn notspelt"
id="notspeltBtn"
disabled
onclick="submitVote('notspelt')">

⏱ Not Spelt
</button>

</div>

</div>

</div>

<!-- CONTROLS -->
<div class="controls">

<button class="control-btn start"
onclick="startCompetitionTimer()">

▶ START TIMER
</button>

<button class="control-btn stop"
onclick="stopCompetitionTimer()">

■ STOP TIMER
</button>

<button class="control-btn finalize"
onclick="finalizeCurrentResult()">

✔ FINALIZE RESULT
</button>

<button class="control-btn next"
onclick="moveToNextWord()">

⏭ NEXT WORD
</button>

<button class="control-btn next"
onclick="nextParticipant()">

👤 NEXT PARTICIPANT
</button>

<button class="control-btn secondary"
onclick="toggleMusicPanel()">

🎵 MUSIC PANEL
</button>

<button class="control-btn reset"
onclick="resetParticipant()">

↺ RESET PARTICIPANT
</button>

<button class="control-btn reset"
onclick="hardResetCompetition()">

🗑 RESET COMPETITION
</button>

</div>

<!-- MUSIC -->
<div class="music-panel"
id="musicPanel">

<h2>
Competition Music & Sounds
</h2>

<div class="music-grid">

<button class="music-btn"
onclick="playMusic('music/welcome.mp3')">

Welcome Music
</button>

<button class="music-btn"
onclick="playMusic('music/tension.mp3')">

Tension Music
</button>

<button class="music-btn"
onclick="playMusic('music/background.mp3')">

Background Music
</button>

<button class="music-btn"
onclick="playMusic('music/victory.mp3')">

Victory Music
</button>

<button class="music-btn"
onclick="stopMusic()">

Stop Music
</button>

</div>

</div>

<div class="footer-note">
Teacher is also an active judge and controls the entire competition flow in realtime.
</div>

</div>

<script src="js/api.js"></script>
<script src="js/competition.js"></script>

</script>

</body>
  </html>
