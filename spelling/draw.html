<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
Participants Draw Assignment
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,sans-serif;
background:#f3f4f6;
color:#111827;

}

.header{

background:linear-gradient(
135deg,
#7c3aed,
#5b21b6
);

color:white;

padding:18px 25px;

display:flex;
justify-content:space-between;
align-items:center;

box-shadow:
0 2px 10px rgba(0,0,0,.1);

}

.header h2{

font-size:24px;
font-weight:bold;

}

.container{

max-width:1200px;
margin:auto;
padding:25px;

}

.tableBox{

background:white;

border-radius:18px;

overflow:hidden;

box-shadow:
0 4px 14px rgba(0,0,0,.08);

}

table{

width:100%;
border-collapse:collapse;

}

thead{

background:#ede9fe;

}

th{

padding:16px;
font-size:15px;
color:#4c1d95;
font-weight:bold;
text-align:center;

}

td{

padding:14px;
border-bottom:1px solid #e5e7eb;
text-align:center;

}

tr:hover{

background:#faf5ff;

}

.nameCell{

font-weight:bold;
color:#111827;

}

.inlineInput{

width:90px;

padding:10px;

border:1px solid #d1d5db;

border-radius:8px;

text-align:center;

font-size:15px;

transition:.2s;

background:white;

}

.inlineInput:focus{

outline:none;

border-color:#7c3aed;

box-shadow:
0 0 0 3px rgba(124,58,237,.15);

}

.inlineInput:hover{

border-color:#7c3aed;

}

.empty{

padding:30px;
text-align:center;
color:#6b7280;

}

.toast{

position:fixed;

bottom:20px;
right:20px;

background:#16a34a;

color:white;

padding:12px 18px;

border-radius:10px;

font-weight:bold;

opacity:0;

transform:translateY(20px);

transition:.3s;

z-index:9999;

}

.toast.show{

opacity:1;
transform:translateY(0);

}

.loading{

padding:30px;
text-align:center;
font-weight:bold;
color:#6b7280;

}

@media(max-width:768px){

.container{

padding:10px;

}

th,td{

padding:10px;
font-size:14px;

}

.inlineInput{

width:75px;
padding:8px;

}

.header h2{

font-size:18px;

}

}

</style>

</head>

<body>

<div class="header">

<h2>
Participants Draw Assignment
</h2>

</div>

<div class="container">

<div class="tableBox">

<table>

<thead>

<tr>

<th>Name</th>

<th>Gender</th>

<th>Group Number</th>

<th>Draw Order</th>

</tr>

</thead>

<tbody id="studentList">

<tr>

<td colspan="4"
class="loading">

Loading students...

</td>

</tr>

</tbody>

</table>

</div>

</div>

<script>

  // ========================================
// LOAD STUDENTS
// ========================================

async function loadStudents(){

try{

// ACTIVE COMPETITION
const competitionRes =
await fetch(
"/api",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
action:"getActiveCompetition"
})
}
);

const competitionData =
await competitionRes.json();

if(!competitionData.competition){

document.getElementById(
"studentList"
).innerHTML = `

<tr>

<td colspan="4"
class="empty">

No Active Competition

</td>

</tr>

`;

return;

}

const competition_id =
competitionData.competition.id;


// LOAD STUDENTS
const res =
await fetch(
"/api",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

action:"getStudentsWithGroups",

competition_id

})
}
);

const data =
await res.json();

const students =
data.students || [];


// EMPTY STATE
if(students.length === 0){

document.getElementById(
"studentList"
).innerHTML = `

<tr>

<td colspan="4"
class="empty">

No students found

</td>

</tr>

`;

return;

}


// BUILD TABLE
let html = "";

students.forEach(student=>{

html += `

<tr>

<td class="nameCell">

${student.full_name || ""}

</td>

<td>

${student.gender || "-"}

</td>

<td>

<input
type="number"

min="1"

class="inlineInput"

id="group-${student.id}"

value="${student.group_id || ""}"

placeholder="Group"

onchange="saveDraw(
${student.id}
)"

>

</td>

<td>

<input
type="number"

min="1"

class="inlineInput"

id="order-${student.id}"

value="${student.draw_order || ""}"

placeholder="Order"

onchange="saveDraw(
${student.id}
)"

>

</td>

</tr>

`;

});

document.getElementById(
"studentList"
).innerHTML = html;

}
catch(error){

console.log(error);

document.getElementById(
"studentList"
).innerHTML = `

<tr>

<td colspan="4"
class="empty">

Failed to load students

</td>

</tr>

`;

}

  }
// ========================================
// SAVE DRAW
// ========================================

async function saveDraw(student_id){

try{

const group_id =
document.getElementById(
`group-${student_id}`
).value;

const draw_order =
document.getElementById(
`order-${student_id}`
).value;


// VALIDATION
if(!group_id || !draw_order){

return;

}

if(
isNaN(group_id) ||
isNaN(draw_order)
){

showToast(
"Invalid values",
true
);

return;

}


// GET ACTIVE COMPETITION
const competitionRes =
await fetch(
"/api",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
action:"getActiveCompetition"
})
}
);

const competitionData =
await competitionRes.json();

const competition_id =
competitionData.competition?.id;

if(!competition_id){

showToast(
"No active competition",
true
);

return;

}


// SAVE
const response =
await fetch(
"/api",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

action:"assignDraw",

competition_id,

student_id,

group_id:
parseInt(group_id),

draw_order:
parseInt(draw_order)

})
}
);

const result =
await response.json();

if(result.success){

showToast(
"Saved successfully"
);

}else{

showToast(
result.message ||
"Failed to save",
true
);

}

}
catch(error){

console.log(error);

showToast(
"Error saving draw",
true
);

}

}



// ========================================
// TOAST
// ========================================

function showToast(
message,
error=false
){

const toast =
document.createElement("div");

toast.className = "toast";

toast.style.background =
error
? "#dc2626"
: "#16a34a";

toast.innerText = message;

document.body.appendChild(
toast
);

setTimeout(()=>{

toast.classList.add(
"show"
);

},100);

setTimeout(()=>{

toast.classList.remove(
"show"
);

setTimeout(()=>{

toast.remove();

},300);

},1800);

}



// ========================================
// INITIALIZE
// ========================================

loadStudents();

</script>

</body>

  </html>
